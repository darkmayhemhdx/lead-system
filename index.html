<style>
/* Layout: native iOS-Muster – großer Titel, Listen in Gruppen, Tab-Leiste unten, Sheets von unten */
:root{
  --bg:#F3F1F2; --surface:#FFFFFF; --surface2:#F8F6F7; --fg:#22191F; --muted:#7B7078; --line:rgba(60,30,50,.12);
  --brand:#503645; --brand-ink:#FFFFFF; --accent:#F5B400; --accent-ink:#2A1E00;
  --ok:#2F8A57; --warn:#B87900; --bad:#C0392B; --tint:rgba(80,54,69,.08);
  --sheet-shade:rgba(20,10,16,.38);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0B0E; --surface:#1C1619; --surface2:#241D21; --fg:#F3EDF0; --muted:#A1959C; --line:rgba(255,235,245,.10);
  --brand:#D6B3C6; --brand-ink:#1E1219; --accent:#F7C548; --accent-ink:#2A1E00;
  --ok:#5BC48A; --warn:#E5A93A; --bad:#F07264; --tint:rgba(214,179,198,.10); --sheet-shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0B0E; --surface:#1C1619; --surface2:#241D21; --fg:#F3EDF0; --muted:#A1959C; --line:rgba(255,235,245,.10);
  --brand:#D6B3C6; --brand-ink:#1E1219; --accent:#F7C548; --accent-ink:#2A1E00;
  --ok:#5BC48A; --warn:#E5A93A; --bad:#F07264; --tint:rgba(214,179,198,.10); --sheet-shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(92px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto}
/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px;margin-bottom:14px}
.top h1{font:700 32px/1.1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.on i{background:var(--ok)}.pill.err i{background:var(--bad)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
/* Gruppen & Zeilen */
.sec{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.sec .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.group>.row:last-child,.group>:last-child .row{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:13px;color:var(--muted);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row .chev{color:var(--muted);opacity:.6;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.od{color:var(--bad)!important;font-weight:600}.td{color:var(--warn)!important;font-weight:600}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:none;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:14px;height:14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
/* Kennzahlen Heute */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
/* Suche & Filter */
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.7}
/* Detail */
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--brand);font-weight:600;font-size:16px;padding:8px 0}
.dh{margin:4px 0 14px}
.dh h1{font:700 28px/1.15 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.dh .addr{color:var(--muted);margin-top:4px}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;color:#fff}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--brand);font-size:12px;font-weight:600;text-decoration:none;text-align:center}
.act svg{width:22px;height:22px}
.act.dis{opacity:.4;pointer-events:none}
.phases{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.phases::-webkit-scrollbar{display:none}
.ph{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.ph.on{color:#fff;border-color:transparent}
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.next.none{border-style:dashed;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
.btn{text-decoration:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--tint);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:5px;padding:10px 14px;border-bottom:1px solid var(--line)}
.group>.field:last-child{border-bottom:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:0;background:none;padding:2px 0;font-size:16px;width:100%;outline:none}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid2>.field:first-child{border-right:1px solid var(--line)}
.grid3{display:grid;grid-template-columns:1.2fr 1fr .8fr}
.grid3>.field{border-right:1px solid var(--line)}.grid3>.field:last-child{border-right:0}
.re{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:12px 6px;background:color-mix(in srgb,var(--ok) 8%,var(--surface));border-top:1px solid var(--line)}
.re b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.re span{font-size:11px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 14px 10px}
.bar div{height:100%;background:var(--ok);border-radius:3px}
.ck{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.ck.done .tx{color:var(--muted);text-decoration:line-through}
.ck .tx{flex:1;min-width:0}
.ck .d{font-size:12px;color:var(--muted)}
.addrow{display:flex;gap:8px;padding:10px 14px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface2);font-size:16px}
.hist{padding:6px 14px 10px}
.hist div{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.hist .when{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);padding:8px 2px;line-height:1.5}
.copyline{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.copyline .v{flex:1;min-width:0;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.copyline .k{font-size:12px;color:var(--muted);width:56px;flex:none}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{display:grid;grid-template-columns:repeat(var(--tabn,4),1fr);max-width:680px;margin:0 auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;position:relative}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--brand)}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
/* Sheet */
.shade{position:fixed;inset:0;z-index:40;background:var(--sheet-shade);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sh-head h3{margin:0;font:700 20px/1.2 var(--display)}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;font-size:16px;padding:6px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* Karte */
.mapbox{position:relative;height:calc(100dvh - 268px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:300px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#1d2420;margin-top:8px}
.mapbox .leaflet-control-attribution{font-size:9px}
.stpin{filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}.stpin.approx{opacity:.75}
.stclu div{border-radius:50%;background:rgba(80,54,69,.92);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mpop{font:13px/1.4 var(--font);min-width:180px}.mpop b{font-size:14px}.mpop .m{color:#6E6670;margin:2px 0 8px}
.mpop .bb{display:flex;gap:6px}.mpop .bb a,.mpop .bb button{flex:1;text-align:center;border:0;border-radius:8px;padding:7px 6px;font-weight:700;font-size:12.5px;text-decoration:none;background:#503645;color:#fff}
.mpop .bb a{background:#F1ECEF;color:#503645}
.medot{width:16px;height:16px;border-radius:50%;background:#2F7BF6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,246,.25)}
.nextcard{margin-top:10px}
/* Sperre */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-left,0px))}
.lock img{width:72px;height:72px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.lock h2{margin:6px 0 0;font:700 22px/1.2 var(--display)}
.lock input{width:220px;text-align:center;font-size:26px;letter-spacing:.4em;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.lock .note{text-align:center;max-width:280px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.calbtn{border:0;background:var(--tint);color:var(--brand);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.calbtn svg{width:18px;height:18px}
/* Bewegung & Rückmeldung */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
.row,.btn,.act,.chip,.ph,.tab,.chk,.ck,.iconbtn,.back,.linkbtn{-webkit-user-select:none;user-select:none;transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
button.row:active,a.row:active,.ck:active,.row .main[onclick]:active{background:var(--tint)}
.btn:active,.act:active,.chip:active,.ph:active,.iconbtn:active{transform:scale(.96)}
.tab:active{transform:scale(.9)}
.chk.justdone{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.app.v-push{animation:vpush .26s cubic-bezier(.2,.8,.2,1)}
.app.v-pop{animation:vpop .26s cubic-bezier(.2,.8,.2,1)}
.app.v-tab{animation:vtab .2s ease}
@keyframes vpush{from{transform:translateX(28%);opacity:0}to{transform:none;opacity:1}}
@keyframes vpop{from{transform:translateX(-18%);opacity:0}to{transform:none;opacity:1}}
@keyframes vtab{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shade.closing{animation:fadeout .2s ease forwards}
.shade.closing .sheet{animation:down .22s ease forwards}
@keyframes fadeout{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
.sheet.dragging{transition:none}
.toast{animation:tin .22s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:tout .2s ease forwards}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tout{to{opacity:0;transform:translate(-50%,6px)}}
/* kompakte Titelleiste beim Scrollen */
.minibar{position:fixed;left:0;right:0;top:0;z-index:15;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);text-align:center;font-weight:700;font-size:16px;transform:translateY(-100%);transition:transform .2s ease;pointer-events:none}
.minibar.show{transform:none}
@media (prefers-reduced-motion:reduce){.shade,.sheet,.app,.toast,.chk.justdone{animation:none!important}.minibar{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.welcome{padding:30px 6px}
.welcome h1{font:800 34px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 8px}
.welcome p{color:var(--muted);margin:0 0 20px}
.steps{display:grid;gap:10px;margin:14px 0}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.step b.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.hide{display:none!important}
</style>

function applyDocs(docs){

function validData(d){ return d&&typeof d==='object'&&Array.isArray(d.leads); }
function importData(D){
  const pending=Object.keys(SY.changedLeads).length+Object.keys(SY.changedTasks).length+Object.keys(SY.deletedTasks).length;
  const ph=new Map(S.leads.map(l=>[l.id,l]));
  const leads=[]; let kept=0;
  D.leads.forEach(dl=>{ const pl=ph.get(dl.id);
    if(pl&&SY.changedLeads[dl.id]!=null){ if(dl._mt&&dl._mt===pl._mt){ leads.push(dl); delete SY.changedLeads[dl.id]; } else { leads.push(pl); kept++; } }
    else leads.push(dl);
    ph.delete(dl.id); });
  ph.forEach(pl=>{ if(SY.changedLeads[pl.id]!=null){ leads.push(pl); kept++; } });
  const pt=new Map(S.tasks.map(t=>[t.id,t]));
  const tasks=[]; const dset=new Set();
  (D.tasks||[]).forEach(dt=>{
    if(SY.deletedTasks[dt.id]!=null){ dset.add(String(dt.id)); pt.delete(dt.id); return; }
    const p=pt.get(dt.id);
    if(p&&SY.changedTasks[dt.id]!=null){ if(dt._mt&&dt._mt===p._mt){ tasks.push(dt); delete SY.changedTasks[dt.id]; } else { tasks.push(p); kept++; } }
    else tasks.push(dt);
    pt.delete(dt.id); });
  pt.forEach(p=>{ if(SY.changedTasks[p.id]!=null){ tasks.push(p); kept++; } });
  Object.keys(SY.deletedTasks).forEach(id=>{ if(!dset.has(id)) delete SY.deletedTasks[id]; });

  SY.lastImport=new Date().toISOString();

  return {leads:D.leads.length,tasks:(D.tasks||[]).length,kept,pending};
}

function finHtml(l){ const aw=l.auftragswert||0, re=rohertragOf(l);
  if(!(aw>0)||re==null) return `<p class="note" style="padding:10px 14px">Wert und Rohertrag in € oder % eintragen – der andere Wert rechnet sich selbst.</p>`;
  return `<div class="re"><div><b>${eur(aw)}</b><span>Umsatz</span></div><div><b>${eur(aw-re)}</b><span>Kosten</span></div><div><b style="color:${re>=0?'var(--ok)':'var(--bad)'}">${eur(re)}</b><span>Rohertrag ${rePct(l)} %</span></div></div>`; }
function setFin(id,src){ const l=getLead(id); if(!l) return;
  const aw=parseFloat($('#d-aw').value)||0; if(aw) l.auftragswert=aw; else delete l.auftragswert;
  if(src==='pct'){ const p=parseFloat($('#d-pc').value); if(!isNaN(p)&&aw>0){ l.rohertrag=Math.round(aw*p/100); $('#d-re').value=l.rohertrag; } else if($('#d-pc').value===''){ delete l.rohertrag; $('#d-re').value=''; } }
  else { const r=parseFloat($('#d-re').value); if($('#d-re').value===''||isNaN(r)) delete l.rohertrag; else l.rohertrag=r; const pp=rePct(l); $('#d-pc').value=pp??''; }
  delete l.projektkosten; touchLead(l); $('#refin').innerHTML=finHtml(l); }
function setStatus(id,s){ const l=getLead(id); if(!l||l.status===s) return;
  if(!l.history) l.history=[{s:l.status,d:l.created||todayStr()}];
  l.history.push({s,d:todayStr()}); l.status=s;
  if(s==='gewonnen') l.wonAt=todayStr(); else delete l.wonAt;
  if(s==='verloren') l.lostAt=todayStr(); else delete l.lostAt;
  touchLead(l); render(); toast(`Phase: ${STAGE_LBL[s]}`); }
function setField(id,k,v){ const l=getLead(id); if(!l) return; l[k]=v; touchLead(l); }
let noteT=null;
function noteInput(id,v){ clearTimeout(noteT); noteT=setTimeout(()=>{ const l=getLead(id); if(l&&l.notiz!==v){ l.notiz=v; touchLead(l); } },600); }
function startChecklist(id){ const l=getLead(id); l.checklist=checkTemplate().map((t,i)=>({id:'c'+i+Date.now().toString(36),text:t,done:false})); touchLead(l); render(); }
function toggleCheck(id,cid){ const l=getLead(id), x=(l.checklist||[]).find(c=>c.id===cid); if(!x) return; x.done=!x.done; if(x.done) x.doneAt=todayStr(); else delete x.doneAt; touchLead(l); const y=window.scrollY; render(); window.scrollTo(0,y); }
function addCheck(id){ const l=getLead(id), i=$('#ck-new'), t=i.value.trim(); if(!t) return; l.checklist.push({id:'c'+Date.now().toString(36),text:t,done:false}); touchLead(l); const y=window.scrollY; render(); window.scrollTo(0,y); }
function askDelete(id){ $('#delzone').innerHTML=`<div class="group" style="padding:14px"><div style="font-weight:700;margin-bottom:4px">Lead wirklich löschen?</div><div class="note" style="padding:0 0 10px">Er landet im Papierkorb (unter „Mehr“) und lässt sich wiederherstellen.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" onclick="render()">Abbrechen</button><button class="btn danger" onclick="doDelete(${id})">Löschen</button></div></div>`; }
function doDelete(id){ const l=getLead(id); l.deletedAt=new Date().toISOString(); touchLead(l); route.detail=null; render(); toast('In den Papierkorb gelegt.'); }
function copyText(t){ if(!t) return; const ok=()=>toast('Kopiert: '+t);
  try{ navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t)); }catch(e){ fallbackCopy(t); } }
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Kopiert: '+t); }catch(e){ toast(t); } ta.remove(); }

// ════════════ Sheets ════════════
function openSheet(title,html){ closeSheet(true); const d=document.createElement('div'); d.className='shade'; d.id='shade';
  d.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><div class="sh-head"><h3>${esc(title)}</h3><button class="linkbtn" onclick="closeSheet()">Schließen</button></div>${html}</div>`;
  d.addEventListener('click',e=>{ if(e.target===d) closeSheet(); }); document.body.appendChild(d);
  const sh=d.querySelector('.sheet'); let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{ if(sh.scrollTop>0||e.target.closest('input,textarea,select')) { y0=null; return; } y0=e.touches[0].clientY; dy=0; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); if(dy>0){ sh.classList.add('dragging'); sh.style.transform=`translateY(${dy}px)`; } },{passive:true});
  sh.addEventListener('touchend',()=>{ if(y0==null) return; sh.classList.remove('dragging'); if(dy>110) closeSheet(); else { sh.style.transition='transform .2s ease'; sh.style.transform=''; setTimeout(()=>sh.style.transition='',220); } y0=null; },{passive:true}); }
function closeSheet(instant){ const d=$('#shade'); if(!d) return; d.removeAttribute('id'); if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){ d.remove(); return; } d.classList.add('closing'); setTimeout(()=>d.remove(),230); }

// ════════════ PIN-Schutz (gleiche PIN wie am Computer) ════════════
let hiddenAt=0;
function pinUser(){ return (S.users||[]).find(u=>u.name===me); }
function lockMins(){ const m=userPrefs().lockMinutes; return m==null?15:m; }
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hashPin(pin,saltB64){
  const salt=saltB64?Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0)):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},key,256);
  return {salt:b64(salt),hash:b64(bits)};
}
function showLock(){ if($('#lock')) return; closeSheet(true); const d=document.createElement('div'); d.id='lock'; d.className='lock';
  d.innerHTML=`<img src="apple-touch-icon.png" alt="" onerror="this.remove()"><h2>Lead System gesperrt</h2><div class="note">PIN eingeben, ${esc(me)}</div>
    <input id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" onkeydown="if(event.key==='Enter')tryUnlock()" oninput="if(this.value.length>=4&&pinUser()&&pinUser().pin)tryUnlock(true)">
    <button class="btn primary" style="width:220px" onclick="tryUnlock()">Entsperren</button>
    <div class="note">PIN vergessen? Am Computer unter ⚙ Einstellungen → PIN-Schutz ändern.</div>`;
  document.body.appendChild(d); setTimeout(()=>{ const i=$('#lock-pin'); if(i) i.focus(); },150); }
async function tryUnlock(auto){ const u=pinUser(), i=$('#lock-pin'); if(!u||!u.pin){ $('#lock')&&$('#lock').remove(); return; }
  const h=await hashPin(i.value,u.pin.salt);
  if(h.hash===u.pin.hash){ $('#lock').remove(); hiddenAt=0; }
  else if(!auto||i.value.length>=8){ i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); i.value=''; } }
function pinSectionHtml(){ const u=pinUser(), on=!!(u&&u.pin);
  return `<div class="sec"><h2>PIN-Schutz</h2></div><div class="group">
    <div class="row"><div class="main"><div class="t">${on?'PIN ist aktiv':'Keine PIN'}</div><div class="m">${on?'Gleiche PIN wie am Computer – wird beim Öffnen abgefragt':'Schützt die Kundendaten auf dem iPhone'}</div></div></div>
    <button class="row" onclick="openPinSheet()"><div class="main"><div class="t" style="color:var(--brand)">${on?'PIN ändern':'PIN festlegen'}</div></div><span class="chev">${IC.chev}</span></button>
    ${on?`<div class="field"><label for="lockmin">Automatisch sperren nach</label><select id="lockmin" onchange="userPrefs().lockMinutes=+this.value;persist()">${[[1,'1 Min.'],[5,'5 Min.'],[15,'15 Min.'],[60,'1 Std.'],[0,'nur beim Start']].map(([m,l])=>`<option value="${m}"${lockMins()===m?' selected':''}>${l}</option>`).join('')}</select></div>
    <button class="row" onclick="openPinSheet(true)"><div class="main"><div class="t" style="color:var(--bad)">PIN entfernen</div></div></button>`:''}</div>`; }
function openPinSheet(remove){ const u=pinUser(), on=!!(u&&u.pin);
  openSheet(remove?'PIN entfernen':on?'PIN ändern':'PIN festlegen',`<div class="group">
    ${on?'<div class="field"><label for="pn0">Aktuelle PIN</label><input id="pn0" type="password" inputmode="numeric" maxlength="8"></div>':''}
    ${remove?'':'<div class="field"><label for="pn1">Neue PIN (4–8 Ziffern)</label><input id="pn1" type="password" inputmode="numeric" maxlength="8"></div><div class="field"><label for="pn2">Neue PIN wiederholen</label><input id="pn2" type="password" inputmode="numeric" maxlength="8"></div>'}
  </div><button class="btn ${remove?'danger':'primary'} block" style="margin-top:14px" onclick="savePin(${!!remove})">${remove?'PIN entfernen':'Speichern'}</button>
  <p class="note">Die PIN gilt auf allen Geräten – auch am Computer.</p>`); }
async function savePin(remove){ let u=pinUser(); if(!u){ u={name:me,role:'employee'}; (S.users=S.users||[]).push(u); }
  if(u.pin){ const h=await hashPin($('#pn0').value,u.pin.salt); if(h.hash!==u.pin.hash){ toast('Aktuelle PIN stimmt nicht.'); return; } }
  if(remove){ delete u.pin; } else { const a=$('#pn1').value, b=$('#pn2').value; if(!/^\d{4,8}$/.test(a)){ toast('Bitte 4–8 Ziffern eingeben.'); return; } if(a!==b){ toast('Die PINs stimmen nicht überein.'); return; } u.pin=await hashPin(a); }
  persist(); closeSheet(); render(); toast(remove?'PIN entfernt.':'PIN gespeichert – gilt jetzt auf allen Geräten.'); }

// ════════════ Kalender ════════════
const CAL_DUR={Termin:60,Besichtigung:90,Anruf:15,Angebot:30,Nachfassung:15,Erinnerung:15,Sonstiges:30};
function icsFor(t){ const l=t.leadId?getLead(t.leadId):null, p=n=>String(n).padStart(2,'0'), e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const [y,m,d]=t.dueDate.split('-').map(Number), who=l?' – '+nameOf(l):'';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lead System//DE','BEGIN:VEVENT','UID:task-'+t.id+'@lead-system','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'];
  if(!t.dueTime){ const n=new Date(y,m-1,d+1); L.push(`DTSTART;VALUE=DATE:${y}${p(m)}${p(d)}`,`DTEND;VALUE=DATE:${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}`); }
  else { const [hh,mi]=t.dueTime.split(':').map(Number), en=new Date(y,m-1,d,hh,mi+(CAL_DUR[t.type]||30)); L.push(`DTSTART:${y}${p(m)}${p(d)}T${p(hh)}${p(mi)}00`,`DTEND:${en.getFullYear()}${p(en.getMonth()+1)}${p(en.getDate())}T${p(en.getHours())}${p(en.getMinutes())}00`); }
  L.push('SUMMARY:'+e((t.type||'Aufgabe')+who+(t.title&&t.title!==t.type&&!l?': '+t.title:'')));
  if(l&&(l.strasse||l.ort)) L.push('LOCATION:'+e(`${l.strasse||''}, ${l.plz||''} ${l.ort||''}`));
  L.push('DESCRIPTION:'+e([t.title,l&&l.telefon?'Telefon: '+l.telefon:'',l&&l.email?'E-Mail: '+l.email:''].filter(Boolean).join('\n')));
  if(t.dueTime) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Erinnerung','TRIGGER:-PT'+(VISIT_TYPES.includes(t.type)?60:15)+'M','END:VALARM');
  L.push('END:VEVENT','END:VCALENDAR'); return L.join('\r\n'); }
function addToCalendar(id){ const t=S.tasks.find(x=>x.id===id); if(!t) return;
  const ics=icsFor(t), file=new File([ics],'Termin.ics',{type:'text/calendar'});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&!/iPhone|iPad/.test(navigator.userAgent)){ navigator.share({files:[file]}).catch(()=>{}); return; }
  location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics); }
let feedUrl=null;
function calSectionHtml(){ return `<div class="sec"><h2>Kalender</h2></div><div class="group">
  <div class="row"><div class="main"><div class="t">Termine im iPhone-Kalender</div><div class="m">Alle Termine und Aufgaben als Kalender-Abo – aktualisiert sich selbst, mit Erinnerungen</div></div></div>
  ${feedUrl?`<a class="row" href="${esc(feedUrl)}" style="text-decoration:none;color:inherit"><div class="main"><div class="t" style="color:var(--brand)">Im Kalender abonnieren</div><div class="m">Öffnet die Kalender-App</div></div><span class="chev">${IC.chev}</span></a>
    <button class="row" onclick="copyText(${esc(JSON.stringify(feedUrl))})"><div class="main"><div class="t">Link kopieren</div><div class="m" style="white-space:normal;word-break:break-all">${esc(feedUrl)}</div></div></button>`
  :`<button class="row" onclick="makeFeed()"><div class="main"><div class="t" style="color:var(--brand)">Kalender-Abo einrichten</div></div><span class="chev">${IC.chev}</span></button>`}</div>
  <p class="note">Einzelne Termine: im Lead beim Termin auf das Kalender-Symbol tippen.</p>`; }
async function makeFeed(){ try{ const t=await LeadSync.rpc('ls_feed_token',{p_owner:me,p_renew:false}); feedUrl='webcal://'+String(LeadSync.info.cfg.url).replace(/^https?:\/\//,'')+'/functions/v1/kalender?t='+t; const y=window.scrollY; render(); window.scrollTo(0,y); }
  catch(e){ toast(/ls_feed_token|404|PGRST/.test(e.message)?'Kalender-Abo ist in Supabase noch nicht eingerichtet.':'Fehler: '+e.message); } }

// ════════════ Karte ════════════
let mapObj=null, mapCluster=null, mapFilter='aktiv', mapBase='sat', PLZLL=null, geoQ=[], geoBusy=false, meMarker=null;
function MAP_OK(){ return typeof L!=='undefined'&&!!L.markerClusterGroup; }
async function loadPlz(){ if(PLZLL) return PLZLL; try{ PLZLL=await (await fetch('plz-latlon.json')).json(); }catch(e){ PLZLL={}; } return PLZLL; }
const addrKey=l=>[l.strasse,String(l.plz||'').trim(),l.ort].map(x=>String(x||'').trim().toLowerCase()).join('|');
function leadPos(l){ if(l.geo&&isFinite(l.geo.lat)&&(!l.geo.key||l.geo.key===addrKey(l)||l.geo.src==='manuell')) return {lat:l.geo.lat,lng:l.geo.lon,exact:true};
  const p=PLZLL&&PLZLL[String(l.plz||'').trim()]; if(!p) return null; const j=(Number(l.id)*9301+49297)%233280/233280;
  return {lat:p[0]+(j-.5)*.006,lng:p[1]+((j*7)%1-.5)*.009,exact:false}; }
function mapLeads(){ const all=myLeads(); return mapFilter==='gewonnen'?all.filter(l=>l.status==='gewonnen'):mapFilter==='aktiv'?all.filter(isActive):all; }
function karteHtml(){ const nv=nextVisit();
  return `<div class="top"><div><h1>Karte</h1><div class="sub" id="map-sub">${mapLeads().length} Kunden</div></div><button class="iconbtn" onclick="mapLocate()" aria-label="Mein Standort">${IC.locate}</button></div>
  <div class="chips" style="padding-top:0">${[['aktiv','Aktive'],['gewonnen','Gewonnen'],['alle','Alle']].map(([k,n])=>`<button class="chip${mapFilter===k?' on':''}" onclick="mapFilter='${k}';render()">${n}</button>`).join('')}<button class="chip" onclick="mapBase=mapBase==='sat'?'str':'sat';render()">${mapBase==='sat'?'Straßenkarte':'Satellit'}</button></div>
  <div class="mapbox" id="mapbox"></div>
  ${nv?`<div class="group nextcard"><div class="row"><div class="main" onclick="openLead(${nv.l.id})" style="cursor:pointer"><div class="t">Nächster Termin: ${esc(nameOf(nv.l))}</div><div class="m">${fmtDate(nv.t.dueDate)}${nv.t.dueTime?' · '+esc(nv.t.dueTime):''} · ${esc(nv.l.ort||'')}</div></div><a class="btn sm" href="${routeUrl([nv.l])}" target="_blank" rel="noopener">Route</a></div></div>`:''}`; }
function nextVisit(){ const t=myTasks().filter(t=>!t.done&&VISIT_TYPES.includes(t.type)&&t.leadId&&t.dueDate>=todayStr()).sort((a,b)=>(a.dueDate+(a.dueTime||'99')).localeCompare(b.dueDate+(b.dueTime||'99')))[0]; const l=t&&getLead(t.leadId); return l?{t,l}:null; }
function pinIcon(l,exact){ const c=STAGE_COL[l.status]||'#2F8A57';
  return L.divIcon({className:'stpin'+(exact?'':' approx'),html:`<svg viewBox="0 0 28 44" width="28" height="44"><path d="M14 22 L14 43" stroke="#4A4A4A" stroke-width="2.4" stroke-linecap="round"/><circle cx="14" cy="12" r="10.5" fill="${c}" stroke="#fff" stroke-width="2.2"/><circle cx="10.5" cy="8.5" r="3.2" fill="rgba(255,255,255,.55)"/></svg>`,iconSize:[28,44],iconAnchor:[14,43],popupAnchor:[0,-38]}); }
async function buildMap(){ if(!MAP_OK()||route.tab!=='karte'||route.detail!=null) return; const box=$('#mapbox'); if(!box) return;
  await loadPlz(); if(!$('#mapbox')) return;
  if(mapObj){ mapObj.remove(); mapObj=null; }
  mapObj=L.map('mapbox',{zoomControl:false,attributionControl:true,minZoom:6,maxZoom:20,tap:true});
  mapObj.attributionControl.setPrefix(false);
  const esri=x=>`https://server.arcgisonline.com/ArcGIS/rest/services/${x}/MapServer/tile/{z}/{y}/{x}`;
  if(mapBase==='sat'){ L.tileLayer(esri('World_Imagery'),{maxNativeZoom:19,maxZoom:20,attribution:'Bilder © Esri, Maxar'}).addTo(mapObj); L.tileLayer(esri('Reference/World_Transportation'),{maxNativeZoom:19,maxZoom:20,opacity:.9}).addTo(mapObj); L.tileLayer(esri('Reference/World_Boundaries_and_Places'),{maxNativeZoom:19,maxZoom:20}).addTo(mapObj); }
  else L.tileLayer(esri('World_Street_Map'),{maxNativeZoom:19,maxZoom:20,attribution:'Karte © Esri, HERE, Garmin, OpenStreetMap'}).addTo(mapObj);
  mapCluster=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:44,disableClusteringAtZoom:15,iconCreateFunction:c=>{ const n=c.getChildCount(), z=n<10?34:40; return L.divIcon({className:'stclu',html:`<div style="width:${z}px;height:${z}px">${n}</div>`,iconSize:[z,z]}); }});
  const pts=[];
  mapLeads().forEach(l=>{ const p=leadPos(l); if(!p) return; pts.push([p.lat,p.lng]);
    const nt=nextTask(l), m=L.marker([p.lat,p.lng],{icon:pinIcon(l,p.exact)});
    m.bindPopup(`<div class="mpop"><b>${esc(nameOf(l))}</b><div class="m">${esc(STAGE_LBL[l.status]||'')} · ${esc(l.plz||'')} ${esc(l.ort||'')}${nt?'<br>Nächster Schritt: '+esc(nt.type)+', '+fmtDate(nt.dueDate):''}</div><div class="bb"><button onclick="openLead(${l.id})">Öffnen</button><a href="${routeUrl([l])}" target="_blank" rel="noopener">Route</a></div></div>`);
    mapCluster.addLayer(m);
    if(!p.exact&&l.strasse&&l.plz) queueGeo(l); });
  mapObj.addLayer(mapCluster);
  if(pts.length) mapObj.fitBounds(L.latLngBounds(pts).pad(.2),{maxZoom:13}); else mapObj.setView([50.9,11.0],8);
  if(meMarker) meMarker.addTo(mapObj);
  setTimeout(()=>mapObj&&mapObj.invalidateSize(),80); }
function mapLocate(){ if(!navigator.geolocation){ toast('Standort ist nicht verfügbar.'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{ const ll=[pos.coords.latitude,pos.coords.longitude];
    meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="medot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false});
    if(mapObj){ meMarker.addTo(mapObj); mapObj.setView(ll,14); } },()=>toast('Standort nicht freigegeben – in den iPhone-Einstellungen erlauben.'),{enableHighAccuracy:true,timeout:10000}); }
function queueGeo(l){ if(!geoQ.includes(l.id)) geoQ.push(l.id); runGeo(); }
async function runGeo(){ if(geoBusy) return; geoBusy=true;
  while(geoQ.length){ const l=getLead(geoQ.shift()); if(!l) continue;
    try{ const u='https://nominatim.openstreetmap.org/search?'+new URLSearchParams({format:'jsonv2',limit:'1',countrycodes:'de',street:l.strasse,postalcode:String(l.plz).trim(),city:l.ort||''});
      const j=await (await fetch(u,{headers:{'Accept-Language':'de'}})).json();
      if(j&&j[0]){ l.geo={lat:+j[0].lat,lon:+j[0].lon,src:'adresse',key:addrKey(l)}; l._mt=Date.now(); persist(); if(route.tab==='karte'&&!route.detail) buildMap(); } }
    catch(e){ break; }
    await new Promise(r=>setTimeout(r,1200)); }
  geoBusy=false; }

// ════════════ Start ════════════
(function boot(){
  const st=lsGet('lsm-state');
  if(st&&st.S){ S={...S,...st.S}; SY={...SY,...(st.SY||{})}; me=st.me||''; }
  const tab=lsGet('lsm-tab'); if(tab&&['heute','leads','aufgaben','karte','mehr'].includes(tab)) route.tab=tab;
  render(); initCloud();
  if(me&&pinUser()&&pinUser().pin) showLock();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') hiddenAt=Date.now(); else if(me&&pinUser()&&pinUser().pin&&lockMins()>0&&hiddenAt&&Date.now()-hiddenAt>lockMins()*60000) showLock(); });
  if(window.LeadSync) LeadSync.start({getState:()=>({leads:S.leads,tasks:S.tasks,meta:{users:S.users,goals:S.goals,prefs:S.prefs,nextId:S.nextId,taskNextId:S.taskNextId}}),applyRemote:syncApply,onStatus:syncStatus,wipe:syncWipe,deviceInfo:()=>{ const ua=navigator.userAgent; return {name:/iPad/.test(ua)?'iPad':/iPhone/.test(ua)?'iPhone':'Handy-App (Browser)',platform:/iPhone|iPad/.test(ua)?'iOS':'Web',version:'1.8.1',user:me}; }});
  if(!HOSTED){ try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){} if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ clearTimeout(flushTimer); flush(); } });
})();
</script>
